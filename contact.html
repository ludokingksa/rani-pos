<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061119"><link rel="manifest" href="manifest.webmanifest">
<title>যোগাযোগ</title>
<style>
:root{--navy:#061119;--gold:#d9a94e;--bg:#fffaf1;--card:#fff;--text:#2a2233;--sub:#6b6275}
@media (prefers-color-scheme:dark){:root{--bg:#171420;--card:#221e2e;--text:#f4eee6;--sub:#a79fb3}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:30px}
.top{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top a{color:#fff;text-decoration:none;font-size:22px}.top h1{font-size:18px;flex:1}
.wrap{max-width:700px;margin:auto;padding:10px}
.hero{background:var(--navy);color:#fff;border-radius:20px;padding:18px;text-align:center;margin-bottom:10px}
.hero b{display:block;font-size:20px;color:var(--gold)}.hero span{font-size:13px;color:#cfc5b4}
.btn{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid #0001;border-radius:16px;padding:14px;margin-bottom:10px;text-decoration:none;color:var(--text);font:inherit;width:100%;text-align:left}
.btn:active{transform:scale(.98)}.btn i{font-style:normal;font-size:26px;width:44px;height:44px;border-radius:50%;background:#fbe6bd;display:grid;place-items:center;flex:none}
.btn div{flex:1;min-width:0}.btn b{display:block;font-size:16px}.btn small{color:var(--sub);font-size:13px;word-break:break-word}.btn .ar{color:var(--sub);font-size:20px}
.sec{background:var(--card);border-radius:16px;border:1px solid #0001;padding:14px;margin-bottom:10px;font-size:14px;line-height:1.7}
.empty{text-align:center;color:var(--sub);padding:24px 10px;line-height:1.7}
.b{border:0;border-radius:14px;background:var(--gold);color:#222;padding:12px;font:inherit;font-weight:700;width:100%;margin-top:10px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#2e9d5b;color:#fff;padding:9px 18px;border-radius:20px;display:none;z-index:99}
</style><link rel="stylesheet" href="theme.css"></head><body><script>window.LOC=function(){try{var l=localStorage.getItem('lang');return l==='en'?'en-US':l==='ar'?'ar-u-nu-latn':(localStorage.getItem('rani_en')==='1'?'en-US':'bn-BD')}catch(e){return 'bn-BD'}};
(function(){try{if(localStorage.getItem('rani_secure')!=='1')return;var r=localStorage.getItem('rani_role'),bad='owner,manager,cashier'.split(',').indexOf(r)<0,c={};
try{c=JSON.parse(localStorage.getItem('rani_cfg')||'{}')}catch(e){}
var m=+c.idle||0,out=function(){['rani_role','rani_user','rani_uid'].forEach(function(k){localStorage.removeItem(k)});if(parent!==window)parent.postMessage('close','*');else location.replace('index.html')};
if(!bad&&m>0&&Date.now()-(+localStorage.getItem('rani_act')||Date.now())>m*60000){out();return}
if(bad){if(parent!==window)parent.postMessage('close','*');else location.replace('index.html');return}
var t=0;['click','touchstart','keydown'].forEach(function(e){addEventListener(e,function(){var n=Date.now();if(n-t>15000){t=n;localStorage.setItem('rani_act',n)}},true)});localStorage.setItem('rani_act',Date.now());
if(m>0)setInterval(function(){if(Date.now()-(+localStorage.getItem('rani_act')||0)>m*60000)out()},30000)}catch(e){}})()</script><script src="i18n.js"></script>
<div class="top"><a href="index.html" aria-label="Back">←</a><h1>যোগাযোগ</h1></div>
<div class="wrap"><div class="hero"><b id="sn">রাণী সুইটস এন্ড বেকারি</b><span>আমাদের সাথে যোগাযোগ করুন</span></div>
 <div id="list"></div><div id="hrs"></div><div id="act"></div></div><div id="toast"></div>
<script>
var $=function(i){return document.getElementById(i)};
var s={};try{s=JSON.parse(localStorage.getItem('rani_shop')||'{}')}catch(e){}
var secure=localStorage.getItem('rani_secure')==='1',role=localStorage.getItem('rani_role');
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2000)}
function digits(x){return String(x||"").replace(/[০-৯]/g,function(d){return '০১২৩৪৫৬৭৮৯'.indexOf(d)})}
function num(x){return digits(x).replace(/[^\d+]/g,"")}
function wa(x){var d=digits(x).replace(/\D/g,"");if(!d)return "";if(d.indexOf('880')===0)return d;if(d[0]==='0')return '88'+d;return d}
function url(u){u=String(u||"").trim();return /^https?:\/\//i.test(u)?u:'https://'+u}
function item(href,ic,t,sub,ext){return '<a class="btn" href="'+href+'"'+(ext?' target="_blank" rel="noopener"':"")+'><i>'+ic+'</i><div><b>'+t+'</b><small>'+sub+'</small></div><span class="ar">›</span></a>'}
var h="";
if(s.name)$('sn').textContent=s.name;
if(s.phone)h+=item('tel:'+num(s.phone),'📞','কল করুন',s.phone);
var w=wa(s.wa||s.phone);if(w)h+=item('https://wa.me/'+w,'💬','WhatsApp-এ মেসেজ',s.wa||s.phone,1);
if(s.email)h+=item('mailto:'+s.email,'✉️','ইমেইল',s.email);
if(s.addr)h+=item('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.addr),'📍','ম্যাপে ঠিকানা দেখুন',s.addr,1);
if(s.fb)h+=item(url(s.fb),'📘','ফেসবুক পেজ',s.fb,1);
$('list').innerHTML=h||'<div class="sec empty">যোগাযোগের তথ্য এখনো দেওয়া হয়নি।</div>';
if(s.hours)$('hrs').innerHTML='<div class="sec"><b>🕘 খোলার সময়</b><br>'+s.hours.replace(/</g,'&lt;')+'</div>';
var canSet=!secure||role==='owner';
$('act').innerHTML=(h?'<button class="b" id="shr">📤 যোগাযোগের তথ্য শেয়ার করুন</button>':"")+(canSet?'<button class="b" id="set" style="background:var(--navy);color:#fff">'+(h?'তথ্য বদলান (সেটিংস)':'সেটিংসে গিয়ে তথ্য দিন')+'</button>':"");
if($('shr'))$('shr').onclick=function(){var t=(s.name||'রাণী সুইটস এন্ড বেকারি')+(s.phone?'\n📞 '+s.phone:"")+(s.addr?'\n📍 '+s.addr:"")+(s.hours?'\n🕘 '+s.hours:"")+(s.fb?'\n📘 '+s.fb:"");
 if(navigator.share)navigator.share({text:t}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('কপি হয়েছে ✓')})};
if($('set'))$('set').onclick=function(){if(parent!==window)parent.postMessage('close','*');else location.href='settings.html'};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script></body></html>
