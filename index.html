function allowed(g){if(!secure())return true;var l=ACC[g];return !l||l.split(',').indexOf(localStorage.getItem('rani_role'))>=0}
function toast2(m){var t=gid('t2');if(!t){t=document.createElement('div');t.id='t2';t.style.cssText='position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#c0262d;color:#fff;padding:9px 18px;border-radius:20px;z-index:300;font-size:14px';document.body.appendChild(t)}t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},1800)}
async function H(s){try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('rani|'+s));return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}catch(e){var h=5381;for(var i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return 'f'+h}}
var ldb,LU=[];
function lopen(){return new Promise(function(res,rej){var r=indexedDB.open('rani',4);
 r.onupgradeneeded=function(){var d=r.result;['products','sales','materials','stocklog','expenses','users'].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore('' + n,{keyPath:'id',autoIncrement:true})})};
 r.onsuccess=function(){res(r.result)};r.onerror=rej})}
function lall(){return new Promise(function(r){var q=ldb.transaction('users').objectStore('users').getAll();q.onsuccess=function(){r(q.result)}})}
function lput(v){return new Promise(function(r){var t=ldb.transaction('users','readwrite');t.objectStore('users').put(v);t.oncomplete=r})}
function paint(){var b=document.querySelector('.who b'),s=document.querySelector('.who span');
 if(secure()&&localStorage.getItem('rani_user')){b.removeAttribute('data-bn');b.removeAttribute('data-en');b.textContent=localStorage.getItem('rani_user');s.textContent=ROLE[localStorage.getItem('rani_role')]||''}
 [].forEach.call(document.querySelectorAll('[data-go]'),function(a){a.style.opacity=allowed(a.dataset.go)?'':'.35'});backupBanner()}
function backupBanner(){try{var c={};try{c=JSON.parse(localStorage.getItem('rani_cfg')||'{}')}catch(e){}
 var days=c.remind===undefined?7:+c.remind;if(!(days>0))return;if(secure()&&localStorage.getItem('rani_role')!=='owner')return;
 var last=+localStorage.getItem('rani_lastbackup')||0;if(last&&Date.now()-last<=days*864e5)return;
 var td=new Date().toDateString();if(localStorage.getItem('rani_bd')===td)return;
 var q=ldb.transaction('sales').objectStore('sales').count();q.onsuccess=function(){if(!q.result||gid('bk'))return;
  var d=document.createElement('div');d.id='bk';d.style.cssText='margin:10px 14px 0;background:#fff3cd;border:1px solid #d9a94e;border-radius:14px;padding:10px 12px;font-size:14px;color:#5a3a00;display:flex;gap:10px;align-items:center';
  d.innerHTML='<span style="flex:1">⚠️ '+(last?Math.floor((Date.now()-last)/864e5)+' দিন ধরে':'এখনো')+' ডেটা ব্যাকআপ নেওয়া হয়নি</span><button id="bk1" style="border:0;background:#061119;color:#fff;border-radius:10px;padding:8px 10px;font:inherit">ব্যাকআপ নিন</button><button id="bk2" style="border:0;background:none;font-size:18px">✕</button>';
  var pn=document.querySelector('.panel');pn.parentNode.insertBefore(d,pn);
  gid('bk1').onclick=function(){document.querySelector('[data-go="settings"]').click()};
  gid('bk2').onclick=function(){localStorage.setItem('rani_bd',td);d.remove()}}}catch(e){}}
function err(m){gid('le').textContent=m}
function enter(u){localStorage.setItem('rani_act',Date.now());localStorage.setItem('rani_role',u.role);localStorage.setItem('rani_user',u.name);localStorage.setItem('rani_uid',u.id);gid('lg').hidden=true;gid('lp').value='';gid('lc2').value='';gid('ln').value='';err('');paint()}
function locked(){var t=+localStorage.getItem('rani_t')||0,n=Date.now();if(n<t){err('কিছুক্ষণ পরে চেষ্টা করুন ('+Math.ceil((t-n)/1000)+' সেকেন্ড)');return true}return false}
function fail(m){var f=(+localStorage.getItem('rani_f')||0)+1;localStorage.setItem('rani_f',f);if(f>=5){localStorage.setItem('rani_t',Date.now()+30000);localStorage.setItem('rani_f',0);err('৫ বার ভুল — ৩০ সেকেন্ড অপেক্ষা করুন')}else err(m)}
async function doLogin(){if(locked())return;var u=LU.find(function(x){return x.id==gid('lu').value});if(!u)return;
 if(await H(u.salt+gid('lp').value)===u.h){localStorage.setItem('rani_f',0);enter(u)}else fail('পিন ভুল')}
async function doRecover(){if(locked())return;var c=gid('lc2').value.trim().toUpperCase().replace(/[\s-]/g,''),np=gid('ln').value;
 if(!/^\d{4,6}$/.test(np))return err('নতুন পিন ৪–৬ সংখ্যার হতে হবে');
 for(var i=0;i<LU.length;i++){var u=LU[i];if(u.role==='owner'&&u.rh&&await H(u.salt+c)===u.rh){u.h=await H(u.salt+np);await lput(u);localStorage.setItem('rani_f',0);enter(u);return}}
 fail('রিকভারি কোড ভুল')}
function showLogin(){gid('lu').innerHTML=LU.map(function(u){return '<option value="'+u.id+'">'+u.name+' ('+ROLE[u.role]+')</option>'}).join('');gid('lg').hidden=false}
async function boot(){try{ldb=await lopen();LU=await lall()}catch(e){return}
 if(!LU.length){localStorage.removeItem('rani_secure');paint();return}
 localStorage.setItem('rani_secure','1');var uid=localStorage.getItem('rani_uid'),cf={};try{cf=JSON.parse(localStorage.getItem('rani_cfg')||'{}')}catch(e){}
 var im=+cf.idle||0;if(uid&&im>0&&Date.now()-(+localStorage.getItem('rani_act')||Date.now())>im*60000){['rani_role','rani_user','rani_uid'].forEach(function(k){localStorage.removeItem(k)});uid=null}
 if(uid&&LU.some(function(u){return u.id==uid&&u.role===localStorage.getItem('rani_role')})){paint();return}
 showLogin()}
function doLogout(){['rani_role','rani_user','rani_uid'].forEach(function(k){localStorage.removeItem(k)});
 if(secure()){boot()}else toast2('লগ আউট হয়েছে')}
gid('lb').onclick=doLogin;gid('lp').onkeydown=function(e){if(e.key==='Enter')doLogin()};
gid('lf').onclick=function(){gid('lr').hidden=!gid('lr').hidden};gid('lrb').onclick=doRecover;
boot();
(function(){var t=0;['click','touchstart'].forEach(function(e){addEventListener(e,function(){var n=Date.now();if(n-t>15000){t=n;localStorage.setItem('rani_act',n)}},true)})})();
setInterval(function(){if(secure()&&!localStorage.getItem('rani_uid')&&gid('lg').hidden)boot()},3000);
</script></body></html>
