name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          mkdir www
          cp *.html *.js *.css *.png *.webmanifest www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Rani Sweets" com.ranisweets.app --web-dir=www
          npx cap add android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rani-sweets-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
